<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1640px;height:624px;overflow:hidden}
body{position:relative;background:radial-gradient(circle at 78% 20%,#1fa860 0,transparent 45%),linear-gradient(120deg,#0f7a41 0%,#15914f 55%,#127f45 100%);font-family:'Hind Siliguri','Nirmala UI',sans-serif;color:#fff}
/* soft decorative rings, kept to the edges that mobile crops anyway */
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.10)}
/* everything that matters sits in the centre ~1060px, which is what mobile shows */
.safe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:56px;width:1040px}
.badge{flex:none;width:250px;height:250px;border-radius:44px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.badge img{width:200px}
h1{margin:0;font-family:'Poppins',sans-serif;font-weight:700;font-size:84px;line-height:1;letter-spacing:-1px}
h1 span{color:#c9f5d9}
.tag{margin:16px 0 26px;font-size:42px;font-weight:600;line-height:1.25}
.pills{display:flex;gap:14px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 22px 6px;font-size:27px;font-weight:600}
.url{position:absolute;right:300px;bottom:34px;font-family:'Poppins',sans-serif;font-weight:600;font-size:26px;opacity:.9}
</style></head><body>
<div class="ring" style="width:520px;height:520px;left:-180px;top:-260px"></div>
<div class="ring" style="width:680px;height:680px;right:-260px;bottom:-380px"></div>
<div class="safe">
  <div class="badge"><img src="../../../frontend/public/logo-icon.png"></div>
  <div>
    <h1>Shohoje <span>Pai</span></h1>
    <div class="tag">সহজে অর্ডার করুন, ঘরে বসে বুঝে নিন</div>
    <div class="pills"><div class="pill">✓ ক্যাশ অন ডেলিভারি</div><div class="pill">✓ সারা বাংলাদেশে হোম ডেলিভারি</div></div>
  </div>
</div>
<div class="url">shohojepai.com</div>
</body></html>
